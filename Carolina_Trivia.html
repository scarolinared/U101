function question(q,label,reveal){return `<div class="question"><div class="eyebrow">${esc(label)}</div><h2>${esc(q.q)}</h2>${state.deadline?'<div class="timer" data-timer aria-live="off"></div>':''}${reveal?`<div class="answer">${esc(q.a)}</div><p class="note">${esc(q.note)}</p>${q.source?`<a href="${esc(q.source)}" target="_blank" rel="noopener">Check the source ↗</a>`:''}`:''}</div>`}
function standings(){const ranked=[...state.teams].sort((a,b)=>b.score-a.score);let rank=0,last=null;return `<div class="podium">${ranked.map((t,i)=>{if(t.score!==last)rank=i+1;last=t.score;return `<div class="rank"><span>${rank===1?'★':'#'+rank} &nbsp;${esc(t.name)}</span><b>${t.score.toLocaleString()}</b></div>`}).join('')}<p class="status">${ranked.filter(t=>t.score===ranked[0].score).length>1?'A tie at the top! Share the win, or ask a sudden-death question.':'Bragging rights: earned.'}</p></div>`}
function renderHome(){const code=new URLSearchParams(location.search).get('room')||'';app.innerHTML=`<div class="hero"><div><div class="eyebrow">UNIVERSITY 101 • TEAM TRIVIA</div><h1>A little knowledge.<br><em>A lot of<br>Gamecock energy.</em></h1><p class="intro">Five categories. Thirty clues. One final riff.<br>Bring your team and your best educated guesses.</p><div class="pills"><span class="pill">Gamecock Sports</span><span class="pill">USC History</span><span class="pill">SC History</span><span class="pill">Business Failures</span><span class="pill">Easy Accounting</span></div><div class="actions">${HAS_SERVER?btn('Host a live game →','host'):''}${!HAS_SERVER?btn('Play on one screen →','offline'):''}</div>${!HAS_SERVER?'<p class="muted">This downloaded file works on one screen. Phone play requires the included server to be running.</p>':''}<div class="statline"><div><b>05</b>TEAMS</div><div><b>30</b>CLUES</div><div><b>100–600</b>POINTS</div></div></div><div class="join"><div class="eyebrow" style="color:#d9bca1;margin-bottom:15px">ONE PHONE PER TEAM</div><h2>Meet at the buzzer.</h2><p>${HAS_SERVER?'Scan your host’s QR code or enter the six-digit room code below.':'Open this game through the included server to join from a phone.'}</p><form id="joinForm"><label for="roomCode">Room code</label><input id="roomCode" name="code" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" placeholder="000000" value="${esc(code)}" required ${!HAS_SERVER?'disabled':''}><label for="teamName">Team name</label><input id="teamName" name="team" maxlength="24" placeholder="e.g. The Cocky Accountants" autocomplete="off" required ${!HAS_SERVER?'disabled':''}><button type="submit" ${!HAS_SERVER?'disabled':''}>Join the game →</button></form><div class="preview-board" aria-hidden="true">${Array.from({length:10},(_,i)=>'<span>'+((i<5?1:2)*100)+'</span>').join('')}</div></div></div>`+footer();}
function joinURL(){let base;try{base=sessionStorage.getItem('carolina-join-origin')||location.origin}catch{base=location.origin}return base.replace(/\/$/,'')+'/?room='+state.code}
function renderLobby(){app.innerHTML=`<div class="titlebar"><div><div class="eyebrow">${session.local?'CLASSROOM MODE':'YOUR GAME IS READY'}</div><h1>Assemble your teams.</h1></div>${btn('Leave game','leave','outline small')}</div><div class="lobby"><div class="panel">${session.local?'<div class="eyebrow">ONE SCREEN. EVERYONE PLAYS.</div><h2>Five teams, one friendly rivalry.</h2><p class="muted">Choose a team name below to rename it. Use raised hands for buzzing and keep written final wagers private.</p>':`<div class="eyebrow">ENTER THIS ROOM CODE</div><div class="room-code">${state.code}</div><div class="qr" id="qr"></div><a class="join-link" href="${esc(joinURL())}" target="_blank" rel="noopener">${esc(joinURL())}</a><p class="muted">One phone per team. Scan to open, then choose a team name.</p>${btn('Set phone join address','origin','outline small')}<p class="muted">On a local server, use the Wi-Fi address printed in the server window. “localhost” only works on this computer.</p>`}<div class="notice">Correct answer: add the clue’s points. Incorrect: subtract them. Other teams may steal. Final wagers range from 0 to the team’s positive score.</div></div><div class="panel"><div class="eyebrow">${state.teams.length} / 5 TEAMS READY</div><h2>The starting lineup</h2>${state.teams.map((t,i)=>`<div class="team-row"><span>${session.local?btn(esc(t.name),'rename','link',`data-id="${t.id}"`):esc(t.name)}<small>TEAM ${String(i+1).padStart(2,'0')}</small></span>${btn('Remove','remove','outline small',`data-id="${t.id}"`)}</div>`).join('')}${!state.teams.length?'<p class="muted">Teams will appear here when they join.</p>':''}<div class="below">${session.local&&state.teams.length<5?btn('Add team','add','outline'):''}${btn('Start the board →','start','',!state.teams.length?'disabled':'')}</div><p class="muted">Host chooses clues and judges answers. Students answer aloud after buzzing.</p></div></div>`+footer();if(!session.local)drawQR();}
function drawQR(){try{const q=new QRCode(-1,1);q.addData(joinURL());q.make();const n=q.getModuleCount();let paths='';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.isDark(y,x))paths+=`M${x+4} ${y+4}h1v1h-1z`;document.getElementById('qr').innerHTML=`<svg role="img" aria-label="Scan to join room ${state.code}" viewBox="0 0 ${n+8} ${n+8}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="white"/><path d="${paths}" fill="#000"/></svg>`}catch(e){document.getElementById('qr').textContent='Use the link or code.'}}
function renderPlayer(){const t=state.teams.find(t=>t.id===state.me);let html=`<div class="phone"><div class="eyebrow">TEAM ${esc(t.name)} • ROOM ${state.code}</div><h1>${t.score.toLocaleString()} <span class="muted">points</span></h1>`;
 if(state.phase==='lobby')html+=`<div class="panel"><h2>You’re on the roster.</h2><p class="muted">Keep this screen open. Your host will start the game shortly.</p></div>`;
 if(state.phase==='board')html+=`<div class="panel"><h2>Eyes on the board.</h2><p class="muted">Your host is choosing the next clue. Discuss with your teammates, then get ready to buzz.</p></div>`;
 if(state.phase==='clue'){
 html+=question(state.clue,catName(state.active)+' · '+state.clue.value+' POINTS',state.revealed);
 const can=state.buzzer&&!state.buzz&&!state.revealed&&!state.attempted.includes(t.id)&&Date.now()<state.deadline;
 html+=btn(state.revealed?'ANSWER REVEALED':state.buzz===t.id?'YOU’RE UP!':state.buzz?'TEAM ANSWERING':state.attempted.includes(t.id)?'WAIT FOR NEXT CLUE':can?'BUZZ!':'WAIT FOR HOST','buzz','buzz',`${!can?'disabled':''}`)+`<p class="status">${state.buzz===t.id?'Give your answer aloud.':can?'Tap once when your team has an answer.':'Follow along on the host screen.'}</p>`;
 }if(state.phase==='wager'){const max=Math.max(0,t.score);html+=`<div class="panel"><div class="eyebrow">FINAL CATEGORY</div><h2>${esc(state.final.category)}</h2>${state.wagered.includes(t.id)?`<h3>Wager locked: ${state.myWager}</h3><p class="muted">Wait for the final clue.</p>`:`<p class="muted">Wager 0–${max} points. Your wager stays private until results. Negative scores may wager 0.</p><form id="wagerForm"><label for="wager">Your wager</label><input id="wager" type="number" min="0" max="${max}" step="1" value="0" required><div class="below"><button>Lock wager</button></div></form>`}</div>`}
 if(state.phase==='final'){html+=question(state.final,'FINAL CHALLENGE',false);html+=state.submitted.includes(t.id)?`<p class="status">Answer locked: <b>${esc(state.myAnswer)}</b><br>Good luck!</p>`:`<form id="answerForm"><label for="finalAnswer">Your team’s final answer</label><input id="finalAnswer" maxlength="200" required autocomplete="off" placeholder="Name the band"><div class="below"><button id="submitFinal">Lock final answer</button></div></form>`}
 if(state.phase==='reveal')html+=question(state.final,'FINAL ANSWER',true)+`<p class="status">Your host is scoring the final round.</p>`;
 if(state.phase==='ended')html+=standings();html+=scores()+`<div class="below">${btn('Leave game','leave','outline small')}</div></div>`;app.innerHTML=html;tick();}
function renderHelp(){app.innerHTML=`<div class="help-content"><div class="eyebrow">THE PLAYBOOK</div><h1>Knowledge meets friendly competition.</h1><h2>1. Get five teams ready</h2><p>Each team picks one captain and one phone. In a live game, the captain scans the QR code or opens the host’s game address and enters the six-digit room code. The host shares their screen with the class.</p><h2>2. Choose a clue</h2><p>There are six clues in each of five categories. Values run from 100 to 600 points, with difficulty increasing down each column. Accounting stays beginner-friendly throughout. The host opens the selected clue and reads it aloud.</p><h2>3. Buzz, answer, score</h2><p>When the host opens the buzzers, captains have 30 seconds to buzz. The first request received by the server wins; network delays can affect order. That team answers aloud. A correct answer earns the clue’s value; a wrong answer loses it and makes the team ineligible for another attempt on that clue. Reopen buzzers to allow a steal. The last correct team chooses the next clue; the host decides who starts.</p><p>Host buttons also let you choose a team manually. Use this for raised-hand play on one screen or to resolve a disputed buzz. Answers do not need to be phrased as questions. The ± control adjusts a score; “Undo score” reverses the most recent clue judgment while the clue is open.</p><h2>4. The final riff</h2><p>The final category is 1990s Heavy Metal. Lock wagers before revealing the clue. Each team may wager 0 up to its positive score; teams at 0 or below can wager 0. A missing wager defaults to 0 when the host starts. Teams have 60 seconds to submit a private answer. The host closes answers, reveals the solution, and judges each response. A missing answer is incorrect. Highest score wins; ties share the win unless you choose a sudden-death question.</p><h2>One-screen mode</h2><p>The standalone HTML file runs without internet. Use raised hands to buzz, then select a team to answer. For the final, teams write wagers and answers on paper; enter wagers before revealing the clue.</p><h2>Phone connections</h2><p>Live phone play requires the included server to run on a computer reachable by the phones, or deployment to a public Node.js host. On the same Wi-Fi, set the phone join address to the network address printed by the server. Some campus networks block device-to-device traffic, so test this in your classroom. Downloaded HTML alone cannot synchronize phones.</p><p>Live rooms use team nicknames only, allow up to five teams, and expire after 24 hours. Restarting the server clears all rooms. Keep the host tab open; host and team access are remembered in that browser tab. One-screen games save in this browser when storage is available. Rejoining from another browser creates a new team; remove the old team in the lobby if necessary.</p><div class="below">${btn('Back to game','back')}</div></div>`;}
function tick(){if(!state)return;const left=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));document.querySelectorAll('[data-timer]').forEach(el=>el.textContent=left+' sec');if(state.deadline&&left===0){const b=document.querySelector('[data-act="buzz"]');if(b)b.disabled=true;const f=document.getElementById('submitFinal');if(f)f.disabled=true;}}
async function startOffline(){localRoom=newRoom('LOCAL',rand());for(let i=1;i<=5;i++)apply(localRoom,{action:'join',name:'Team '+i,id:rand(),token:rand()},null,CONTENT);session={local:true,token:localRoom.host,code:'LOCAL'};state=view(localRoom,localRoom.host,CONTENT);stash();render()}
async function createLive(){try{session=await api('/api/create',{});state=await api('/api/state?code='+session.code);stash();render()}catch(e){toast('Live hosting needs the included server. '+e.message)}}
app.addEventListener('submit',async e=>{e.preventDefault();if(busy)return;const form=e.target;try{if(form.id==='joinForm'){busy=true;session=await api('/api/action',{action:'join',code:document.getElementById('roomCode').value,name:document.getElementById('teamName').value});stash();state=await api('/api/state?code='+session.code);render();busy=false}else if(form.id==='wagerForm')await act('wager',{amount:Number(document.getElementById('wager').value)});else if(form.id==='answerForm')await act('answer',{answer:document.getElementById('finalAnswer').value});}catch(e){busy=false;toast(e.message)}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act,id=b.dataset.id;
 if(a==='help'){help=true;renderHelp();return}if(a==='back'){help=false;render();return}
 if(a==='host')return createLive();if(a==='offline')return startOffline();
 if(a==='fullscreen'){try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch{toast('Use your browser’s fullscreen option.')}return}
 if(a==='leave'||a==='newgame'){if(!confirm(a==='newgame'?'Start a fresh game? Your current scores will remain only in this session.':'Leave this game on this device?'))return;session=null;state=null;localRoom=null;try{sessionStorage.removeItem('carolina-session');localStorage.removeItem('carolina-local')}catch{}lastJSON='';history.replaceState(null,'',location.pathname);render();return}
 if(a==='origin'){let url=prompt('Enter the address phones can reach (for example, http://192.168.1.20:3000).',sessionStorage.getItem('carolina-join-origin')||location.origin);if(!url)return;try{const u=new URL(url);if(!['http:','https:'].includes(u.protocol))throw Error();sessionStorage.setItem('carolina-join-origin',u.origin);render()}catch{toast('Enter a valid http:// or https:// address.')}return}
 if(a==='adjust'){const n=prompt('Point adjustment for this team (use a minus sign to subtract):','0');if(n===null)return;return act('adjust',{id,amount:Number(n)})}
 if(a==='rename'&&session.local){const n=prompt('Team name:',localRoom.teams.find(t=>t.id===id).name);if(!n?.trim())return;const name=n.trim().slice(0,24);if(localRoom.teams.some(t=>t.id!==id&&t.name.toLowerCase()===name.toLowerCase()))return toast('Choose a unique team name.');localRoom.teams.find(t=>t.id===id).name=name;state=view(localRoom,localRoom.host,CONTENT);stash();render();return}
 if(a==='add'){const name=prompt('Team name:');if(!name)return;return act('add',{name,id:rand(),token:rand()})}
 if(a==='final'&&state.used.length<30&&!confirm('Go to Final Challenge with '+(30-state.used.length)+' clues remaining?'))return;
 if(a==='beginFinal'&&session.local){for(const t of localRoom.teams){const n=Number(document.getElementById('w-'+t.id).value);if(!Number.isInteger(n)||n<0||n>Math.max(0,t.score))return toast('Check the wager for '+t.name);localRoom.wagers[t.id]=n}}
 if(a==='export'){const csv='Team,Score\n'+[...state.teams].sort((a,b)=>b.score-a.score).map(t=>'"'+t.name.replaceAll('"','""')+'",'+t.score).join('\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const l=document.createElement('a');l.href=url;l.download='Carolina_Trivia_Scores.csv';l.click();URL.revokeObjectURL(url);return}
 const map={correct:'judge',incorrect:'judge',gradeCorrect:'gradeFinal',gradeIncorrect:'gradeFinal'};await act(map[a]||a,{id,...(['correct','incorrect','gradeCorrect','gradeIncorrect'].includes(a)?{correct:a==='correct'||a==='gradeCorrect'}:{})});});
async function poll(){if(!session||session.local||busy)return;try{const s=await api('/api/state?code='+session.code);connected=true;const str=JSON.stringify(s);if(str!==lastJSON){state=s;lastJSON=str;render()}document.getElementById('connection').textContent='LIVE • ROOM '+session.code}catch(e){connected=false;document.getElementById('connection').textContent='RECONNECTING…'}}
try{session=JSON.parse(sessionStorage.getItem('carolina-session'));if(session?.local&&HAS_SERVER){session=null}else if(session?.local){localRoom=JSON.parse(localStorage.getItem('carolina-local'));if(localRoom)state=view(localRoom,localRoom.host,CONTENT);else session=null}else if(session&&!HAS_SERVER)session=null}catch{session=null}
render();poll();setInterval(poll,700);setInterval(tick,250);
</script></body></html>
