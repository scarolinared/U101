<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#73000a"><title>Carolina Classroom Challenge</title>
<style>
:root{--g:#73000a;--gd:#460009;--cream:#f7f2e9;--ink:#261d20;--tan:#e7d5b4;--muted:#786c6b;--green:#1c694a}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,Helvetica,sans-serif}button,input,select{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;border:0;border-radius:12px;padding:13px 20px;background:var(--g);color:white;font-weight:700;transition:transform .12s,background .12s}button:hover:not(:disabled){background:var(--gd);transform:translateY(-1px)}button:disabled{cursor:default;opacity:.4}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #cb9b35;outline-offset:4px}.secondary{background:#e9dfd1;color:var(--ink)}.secondary:hover:not(:disabled){background:#dbccb9}.green{background:var(--green)}.outline{background:transparent;border:1px solid #cdbcb5;color:var(--g)}.small{padding:9px 13px;font-size:13px}.danger{background:#93272e}a{color:var(--g)}input{width:100%;border:1px solid #c9bbb0;background:#fffdf9;border-radius:10px;padding:15px;color:var(--ink)}label{display:block;font-size:13px;font-weight:700;margin:17px 0 7px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:23px 4vw;border-bottom:1px solid #dfd3c8}header .brand{font-weight:800;font-size:16px;letter-spacing:-.4px;display:flex;align-items:center;gap:11px}.mark{background:var(--g);color:var(--cream);padding:11px 10px;border-radius:10px;font-size:13px;letter-spacing:1px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--g)}main{max-width:1440px;margin:auto;padding:32px 4vw 45px}.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:60px;align-items:center;min-height:70vh}.hero h1{font-size:clamp(42px,5.8vw,80px);line-height:1.02;letter-spacing:-4px;margin:20px 0}.hero h1 em{font-style:normal;color:var(--g)}.intro{font-size:18px;line-height:1.65;max-width:540px;color:#6d5c5f}.pills{display:flex;gap:9px;flex-wrap:wrap;margin:26px 0}.pill{border:1px solid #d6c7b9;border-radius:25px;padding:8px 12px;font-size:12px;color:#675655}.panel{background:#fffcf7;border:1px solid #e0d3c8;border-radius:24px;padding:30px;box-shadow:0 12px 40px #45251607}.join{background:var(--g);color:white;border-radius:26px;padding:36px}.join p{color:#ead5d6;line-height:1.6}.join h2{font-size:30px;letter-spacing:-1px;margin:0}.join button{background:var(--tan);color:var(--gd);width:100%;margin-top:16px}.join input{border:0}.join label{color:#ead5d6}.hero .actions{display:flex;gap:10px;flex-wrap:wrap}.statline{display:flex;gap:28px;border-top:1px solid #ddcfc2;padding-top:25px;margin-top:35px;font-size:12px;color:var(--muted)}.statline b{display:block;color:var(--g);font-size:25px;margin-bottom:6px}.titlebar{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:25px}.titlebar h1{font-size:34px;letter-spacing:-1.4px;margin:9px 0 0}.toolbar,.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.category{font-weight:800;font-size:clamp(13px,1.35vw,20px);text-align:center;min-height:90px;display:flex;align-items:center;justify-content:center;padding:16px;background:#e9ddcb;border-radius:14px;line-height:1.2}.cell{background:var(--g);border-radius:14px;min-height:72px;font-size:clamp(22px,3vw,40px);font-weight:800;letter-spacing:-1px;color:#f1ddac}.cell:disabled{opacity:1;background:#eae2d8;color:#b4a79a}.scoreboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:28px 0 16px}.score{border:1px solid #dbcbbc;background:#fffaf2;padding:17px 20px;border-radius:15px;min-width:0}.score b{display:block;font-size:29px;color:var(--g);margin-top:9px}.score .name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score.active{outline:3px solid #b18b4e}.score .adjust{float:right;background:none;color:var(--g);padding:0 0 0 7px}.score small{color:#87796d}.question{text-align:center;padding:38px 5vw;background:var(--g);color:white;border-radius:25px;min-height:300px;display:flex;align-items:center;justify-content:center;flex-direction:column}.question .eyebrow{color:#e4c694}.question h2{font-size:clamp(25px,3.1vw,45px);line-height:1.28;max-width:1030px;letter-spacing:-.8px}.question .answer{font-size:clamp(26px,3vw,39px);color:#efdaaa;border-top:1px solid #c18c92;width:100%;padding-top:20px;font-weight:700}.question .note{font-size:15px;color:#edd9d9;max-width:750px;line-height:1.6}.question a{color:#efdaaa;font-size:13px}.below{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:22px 0}.status{text-align:center;font-size:16px;color:#705c5e;margin:18px 0;line-height:1.55}.timer{font-variant-numeric:tabular-nums;font-size:22px;font-weight:800;border:1px solid #b58d90;border-radius:40px;padding:9px 18px;color:#efdaaa;min-width:90px}.lobby{display:grid;grid-template-columns:1.15fr .85fr;gap:25px}.room-code{font-size:clamp(45px,6vw,76px);font-weight:800;letter-spacing:8px;margin:10px 0;color:var(--g)}.qr{background:white;border:1px solid #ddcfc0;border-radius:16px;width:205px;height:205px;padding:13px}.qr svg{width:100%;height:100%}.join-link{display:block;word-break:break-all;font-size:13px;margin:14px 0;line-height:1.6}.team-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid #eadfd2;font-weight:700}.team-row span small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:4px}.muted{color:var(--muted);font-size:14px;line-height:1.65}.notice{background:#eee1c9;border-radius:12px;padding:13px 18px;font-size:13px;line-height:1.6;margin:20px 0}.buzz{width:min(100%,440px);border-radius:28px;min-height:200px;font-size:45px;box-shadow:0 7px 0 #49000a;margin:20px auto;display:block}.buzz:disabled{box-shadow:none}.phone{max-width:620px;margin:auto}.phone h1{font-size:35px;letter-spacing:-1px}.phone .question{padding:28px;min-height:200px}.phone .question h2{font-size:25px}.finals{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px;margin:24px 0}.finals h3{margin-top:0}.submission{font-size:20px;line-height:1.5;word-break:break-word;min-height:60px}.podium{max-width:750px;margin:30px auto}.rank{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px;background:#fffaf3;border-radius:15px;margin:10px 0;border:1px solid #decab2}.rank:first-child{background:var(--g);color:#f4deb3}.rank b{font-size:28px}.rank span{font-size:20px}.foot{margin:28px 0 0;color:#9a8a7e;font-size:11px}.error{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);max-width:90vw;background:#2d1c20;color:white;padding:15px 22px;border-radius:12px;z-index:30;box-shadow:0 5px 22px #0003}.help-content{max-width:800px;margin:auto}.help-content h2{color:var(--g);margin-top:30px}.help-content p,.help-content li{line-height:1.75}.help-content li{margin-bottom:9px}.preview-board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;transform:rotate(-3deg);margin:22px 0}.preview-board span{background:#910b1b;border:1px solid #b34b57;border-radius:8px;height:43px;display:grid;place-items:center;color:#f3d8a0;font-size:18px;font-weight:bold}.badge{display:inline-block;font-size:11px;padding:7px 10px;border-radius:30px;background:#e9dece;color:#6b4146;white-space:nowrap}button.link{background:none;color:var(--g);font-size:13px;padding:5px}.hidden{display:none}
@media(min-width:1300px){.cell{min-height:80px}}@media(max-width:800px){header{padding:18px 20px}main{padding:25px 20px}.hero,.lobby{grid-template-columns:1fr;gap:30px}.hero{min-height:auto}.hero h1{letter-spacing:-2.4px}.join{padding:26px}.titlebar{align-items:start;flex-direction:column}.board{gap:6px}.category{font-size:11px;padding:9px 4px;min-height:77px}.cell{font-size:24px;min-height:65px;padding:10px 2px}.panel{padding:23px}.scoreboard{grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}.score{padding:13px}.score b{font-size:24px}.question{padding:30px 21px}.toolbar button{font-size:12px;padding:10px 12px}header .brand{font-size:13px}.room-code{letter-spacing:5px}.hero .intro{font-size:17px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header><div class="brand"><span class="mark">U101</span> Carolina Classroom Challenge</div><div class="toolbar"><span class="badge" id="connection">CLASSROOM TRIVIA</span><button class="link" data-act="help">How to play</button></div></header><main id="app"></main><div id="toast" class="error hidden" role="alert"></div>
<script>
/*DATA*/
/*QR*/
/*CORE*/
const HAS_SERVER = false;
const app=document.getElementById('app');let session=null;let localRoom=null;let state=null;let lastJSON='';let help=false;let busy=false;let connected=true;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(text,act,cls='',attrs='')=>`<button class="${cls}" data-act="${act}" ${attrs}>${text}</button>`;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),5000)}
function stash(){try{sessionStorage.setItem('carolina-session',JSON.stringify(session));if(localRoom)localStorage.setItem('carolina-local',JSON.stringify(localRoom))}catch{}}
function rand(){return globalThis.crypto?.randomUUID?.()||Math.random().toString(36).slice(2)}
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',...(session?.token?{'Authorization':'Bearer '+session.token}:{})},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok)throw Error(d.error||'Could not connect.');return d}
async function act(action,args={}){if(busy)return;busy=true;try{
 if(session.local){apply(localRoom,{action,...args},localRoom.host,CONTENT);state=view(localRoom,localRoom.host,CONTENT);stash()}
 else {state=await api('/api/action',{code:session.code,action,...args})}
 lastJSON=JSON.stringify(state);render();
 }catch(e){toast(e.message)}finally{busy=false}}
function scores(){return `<div class="scoreboard">${state.teams.map(t=>`<div class="score ${state.buzz===t.id?'active':''}"><div class="name">${esc(t.name)}${state.isHost?btn('±','adjust','adjust',`data-id="${esc(t.id)}" title="Adjust score" aria-label="Adjust ${esc(t.name)} score"`):''}</div><b>${t.score.toLocaleString()}</b><small>POINTS</small></div>`).join('')}</div>`}
let renderedPhase;
function render(){
 const phase=state?.phase||'home';
 const fields=Array.from(document.querySelectorAll('input')).map(el=>({id:el.id,value:el.value}));
 const active=document.activeElement?.id;const start=document.activeElement?.selectionStart;const end=document.activeElement?.selectionEnd;
 renderNow();
 if(renderedPhase===phase){for(const f of fields){const el=document.getElementById(f.id);if(el)el.value=f.value}const el=active&&document.getElementById(active);if(el){el.focus();try{el.setSelectionRange(start,end)}catch{}}}
 renderedPhase=phase;
}
function renderNow(){if(help)return renderHelp();document.getElementById('connection').textContent=session?(session.local?'CLASSROOM MODE':connected?'LIVE • ROOM '+session.code:'RECONNECTING…'):'CLASSROOM TRIVIA';if(!state)return renderHome();if(!state.isHost)return renderPlayer();
 if(state.phase==='lobby')return renderLobby();
 let html=`<div class="titlebar"><div><div class="eyebrow">${session.local?'ONE SCREEN • FIVE TEAMS':'HOST DESK • ROOM '+state.code}</div><h1>${state.phase==='board'?'Pick your next challenge.':state.phase==='ended'?'That’s a wrap, Gamecocks.':state.phase==='clue'?catName(state.active):'Final Challenge'}</h1></div><div class="toolbar">${btn('Fullscreen','fullscreen','outline small')}${btn('Leave game','leave','outline small')}</div></div>`;
 if(state.phase==='board'){
 html+=`<div class="board">${CONTENT.categories.map(c=>`<div class="category">${esc(c.name)}</div>`).join('')}${Array.from({length:6},(_,j)=>CONTENT.categories.map(c=>{const q=c.clues[j],used=state.used.includes(q.id);return btn(used?'—':q.value,'select','cell',`data-id="${q.id}" ${used?'disabled':''} aria-label="${esc(c.name)}, ${q.value} points${used?', used':''}"`)}).join('')).join('')}</div>`;
 html+=scores()+`<div class="titlebar"><p class="muted">${state.used.length} / 30 clues played · Higher points, tougher clues.<br>The last team to answer correctly chooses the next clue.</p>${btn('Final Challenge →','final','outline')}</div>`;
 }else if(state.phase==='clue'){
 html+=question(state.clue,catName(state.active)+' · '+state.clue.value+' POINTS',state.revealed);
 if(state.revealed)html+=`<div class="below">${btn('Back to board →','board')}${state.canUndo?btn('Undo score','undo','outline'):''}</div>`;
 else if(state.buzz){const t=state.teams.find(t=>t.id===state.buzz);html+=`<div class="status"><b>${esc(t.name)}</b> has the floor. Answer aloud.</div><div class="below">${btn('✓ Correct +'+state.clue.value,'correct','green')}${btn('✕ Incorrect −'+state.clue.value,'incorrect','danger')}</div>`}
 else html+=`<div class="status">${state.buzzer?'Buzzers are open. First request received wins.':state.attempted.length?'Ready for a steal? Reopen buzzers or choose a team.':session.local?'Read the clue aloud, then choose the first team to raise a hand.':'Read the clue aloud, then open the buzzers.'}</div><div class="below">${!session.local?btn(state.buzzer?'Restart 30-second clock':'Open buzzers · 30 sec','open'):''}${btn('Reveal / nobody got it','reveal','outline')}${state.canUndo?btn('Undo score','undo','outline'):''}</div><div class="below">${state.teams.filter(t=>!state.attempted.includes(t.id)).map(t=>btn(esc(t.name),'manual','secondary small',`data-id="${t.id}"`)).join('')}</div>`;
 html+=scores();
 }else if(state.phase==='wager'){
 html+=`<div class="question"><div class="eyebrow">FINAL CATEGORY</div><h2>${esc(state.final.category)}</h2><p>One last chance to change the leaderboard.</p></div>`;
 if(session.local)html+=`<div class="notice">Have each team privately write a wager from 0 up to its available score (negative scores may wager 0). Record it below before revealing the clue.</div><div class="finals">${state.teams.map(t=>`<div class="panel"><h3>${esc(t.name)}</h3><p>Available: ${Math.max(0,t.score)} points</p><label for="w-${t.id}">Wager</label><input id="w-${t.id}" type="number" min="0" max="${Math.max(0,t.score)}" value="${state.wagers[t.id]??0}"></div>`).join('')}</div>`;
 else html+=`<div class="panel"><h3>${state.wagered.length} / ${state.teams.length} wagers locked</h3>${state.teams.map(t=>`<p>${state.wagered.includes(t.id)?'✓':'○'} ${esc(t.name)}</p>`).join('')}<p class="muted">Starting without a team’s wager gives that team a wager of 0.</p></div>`;
 html+=`<div class="below">${btn('Reveal final clue · 60 sec','beginFinal')}</div>`+scores();
 }else if(state.phase==='final'){
 html+=question(state.final,'1990s HEAVY METAL',false)+`<div class="status">${session.local?'Teams: write down your final answer.':state.submitted.length+' / '+state.teams.length+' answers submitted. Answers remain private.'}</div><div class="below">${btn('Close answers & reveal','closeFinal','outline')}</div>`+scores();
 }else if(state.phase==='reveal'){
 html+=question(state.final,'FINAL ANSWER',true)+`<div class="finals">${state.teams.map(t=>`<div class="panel"><h3>${esc(t.name)}</h3><p class="muted">Wager: ${state.wagers[t.id]??0}</p><p class="submission">${session.local?'Ask the team to reveal its written answer.':esc(state.finalAnswers[t.id]||'No answer submitted.')}</p>${Object.hasOwn(state.grades,t.id)?`<b>${state.grades[t.id]?'✓ Correct':'✕ Incorrect'} · Scored</b>`:`<div class="actions">${btn('Correct','gradeCorrect','green small',`data-id="${t.id}"`)}${btn('Incorrect','gradeIncorrect','secondary small',`data-id="${t.id}"`)}</div>`}</div>`).join('')}</div><div class="below">${btn('Show final standings →','finish','',state.teams.some(t=>!Object.hasOwn(state.grades,t.id))?'disabled':'')}</div>`+scores();
 }else if(state.phase==='ended'){html+=standings()+`<div class="below">${btn('Play a new game','newgame')}${btn('Download scores','export','outline')}</div>`}
 app.innerHTML=html+footer();tick();}
function catName(id){return CONTENT.categories[Number(id?.split('-')[0])]?.name||'Challenge'}
function footer(){return '<p class="foot">Made for University 101 · An independent classroom activity · No response-in-question-form rule.</p>'}
function question(q,label,reveal){return `<div class="question"><div class="eyebrow">${esc(label)}</div><h2>${esc(q.q)}</h2>${state.deadline?'<div class="timer" data-timer aria-live="off"></div>':''}${reveal?`<div class="answer">${esc(q.a)}</div><p class="note">${esc(q.note)}</p>${q.source?`<a href="${esc(q.source)}" target="_blank" rel="noopener">Check the source ↗</a>`:''}`:''}</div>`}
function standings(){const ranked=[...state.teams].sort((a,b)=>b.score-a.score);let rank=0,last=null;return `<div class="podium">${ranked.map((t,i)=>{if(t.score!==last)rank=i+1;last=t.score;return `<div class="rank"><span>${rank===1?'★':'#'+rank} &nbsp;${esc(t.name)}</span><b>${t.score.toLocaleString()}</b></div>`}).join('')}<p class="status">${ranked.filter(t=>t.score===ranked[0].score).length>1?'A tie at the top! Share the win, or ask a sudden-death question.':'Bragging rights: earned.'}</p></div>`}
function renderHome(){const code=new URLSearchParams(location.search).get('room')||'';app.innerHTML=`<div class="hero"><div><div class="eyebrow">UNIVERSITY 101 • TEAM TRIVIA</div><h1>A little knowledge.<br><em>A lot of<br>Gamecock energy.</em></h1><p class="intro">Five categories. Thirty clues. One final riff.<br>Bring your team and your best educated guesses.</p><div class="pills"><span class="pill">Gamecock Sports</span><span class="pill">USC History</span><span class="pill">SC History</span><span class="pill">Business Failures</span><span class="pill">Easy Accounting</span></div><div class="actions">${HAS_SERVER?btn('Host a live game →','host'):''}${!HAS_SERVER?btn('Play on one screen →','offline'):''}</div>${!HAS_SERVER?'<p class="muted">This downloaded file works on one screen. Phone play requires the included server to be running.</p>':''}<div class="statline"><div><b>05</b>TEAMS</div><div><b>30</b>CLUES</div><div><b>100–600</b>POINTS</div></div></div><div class="join"><div class="eyebrow" style="color:#d9bca1;margin-bottom:15px">ONE PHONE PER TEAM</div><h2>Meet at the buzzer.</h2><p>${HAS_SERVER?'Scan your host’s QR code or enter the six-digit room code below.':'Open this game through the included server to join from a phone.'}</p><form id="joinForm"><label for="roomCode">Room code</label><input id="roomCode" name="code" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" placeholder="000000" value="${esc(code)}" required ${!HAS_SERVER?'disabled':''}><label for="teamName">Team name</label><input id="teamName" name="team" maxlength="24" placeholder="e.g. The Cocky Accountants" autocomplete="off" required ${!HAS_SERVER?'disabled':''}><button type="submit" ${!HAS_SERVER?'disabled':''}>Join the game →</button></form><div class="preview-board" aria-hidden="true">${Array.from({length:10},(_,i)=>'<span>'+((i<5?1:2)*100)+'</span>').join('')}</div></div></div>`+footer();}
function joinURL(){let base;try{base=sessionStorage.getItem('carolina-join-origin')||location.origin}catch{base=location.origin}return base.replace(/\/$/,'')+'/?room='+state.code}
function renderLobby(){app.innerHTML=`<div class="titlebar"><div><div class="eyebrow">${session.local?'CLASSROOM MODE':'YOUR GAME IS READY'}</div><h1>Assemble your teams.</h1></div>${btn('Leave game','leave','outline small')}</div><div class="lobby"><div class="panel">${session.local?'<div class="eyebrow">ONE SCREEN. EVERYONE PLAYS.</div><h2>Five teams, one friendly rivalry.</h2><p class="muted">Choose a team name below to rename it. Use raised hands for buzzing and keep written final wagers private.</p>':`<div class="eyebrow">ENTER THIS ROOM CODE</div><div class="room-code">${state.code}</div><div class="qr" id="qr"></div><a class="join-link" href="${esc(joinURL())}" target="_blank" rel="noopener">${esc(joinURL())}</a><p class="muted">One phone per team. Scan to open, then choose a team name.</p>${btn('Set phone join address','origin','outline small')}<p class="muted">On a local server, use the Wi-Fi address printed in the server window. “localhost” only works on this computer.</p>`}<div class="notice">Correct answer: add the clue’s points. Incorrect: subtract them. Other teams may steal. Final wagers range from 0 to the team’s positive score.</div></div><div class="panel"><div class="eyebrow">${state.teams.length} / 5 TEAMS READY</div><h2>The starting lineup</h2>${state.teams.map((t,i)=>`<div class="team-row"><span>${session.local?btn(esc(t.name),'rename','link',`data-id="${t.id}"`):esc(t.name)}<small>TEAM ${String(i+1).padStart(2,'0')}</small></span>${btn('Remove','remove','outline small',`data-id="${t.id}"`)}</div>`).join('')}${!state.teams.length?'<p class="muted">Teams will appear here when they join.</p>':''}<div class="below">${session.local&&state.teams.length<5?btn('Add team','add','outline'):''}${btn('Start the board →','start','',!state.teams.length?'disabled':'')}</div><p class="muted">Host chooses clues and judges answers. Students answer aloud after buzzing.</p></div></div>`+footer();if(!session.local)drawQR();}
function drawQR(){try{const q=new QRCode(-1,1);q.addData(joinURL());q.make();const n=q.getModuleCount();let paths='';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.isDark(y,x))paths+=`M${x+4} ${y+4}h1v1h-1z`;document.getElementById('qr').innerHTML=`<svg role="img" aria-label="Scan to join room ${state.code}" viewBox="0 0 ${n+8} ${n+8}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="white"/><path d="${paths}" fill="#000"/></svg>`}catch(e){document.getElementById('qr').textContent='Use the link or code.'}}
function renderPlayer(){const t=state.teams.find(t=>t.id===state.me);let html=`<div class="phone"><div class="eyebrow">TEAM ${esc(t.name)} • ROOM ${state.code}</div><h1>${t.score.toLocaleString()} <span class="muted">points</span></h1>`;
 if(state.phase==='lobby')html+=`<div class="panel"><h2>You’re on the roster.</h2><p class="muted">Keep this screen open. Your host will start the game shortly.</p></div>`;
 if(state.phase==='board')html+=`<div class="panel"><h2>Eyes on the board.</h2><p class="muted">Your host is choosing the next clue. Discuss with your teammates, then get ready to buzz.</p></div>`;
 if(state.phase==='clue'){
 html+=question(state.clue,catName(state.active)+' · '+state.clue.value+' POINTS',state.revealed);
 const can=state.buzzer&&!state.buzz&&!state.revealed&&!state.attempted.includes(t.id)&&Date.now()<state.deadline;
 html+=btn(state.revealed?'ANSWER REVEALED':state.buzz===t.id?'YOU’RE UP!':state.buzz?'TEAM ANSWERING':state.attempted.includes(t.id)?'WAIT FOR NEXT CLUE':can?'BUZZ!':'WAIT FOR HOST','buzz','buzz',`${!can?'disabled':''}`)+`<p class="status">${state.buzz===t.id?'Give your answer aloud.':can?'Tap once when your team has an answer.':'Follow along on the host screen.'}</p>`;
 }if(state.phase==='wager'){const max=Math.max(0,t.score);html+=`<div class="panel"><div class="eyebrow">FINAL CATEGORY</div><h2>${esc(state.final.category)}</h2>${state.wagered.includes(t.id)?`<h3>Wager locked: ${state.myWager}</h3><p class="muted">Wait for the final clue.</p>`:`<p class="muted">Wager 0–${max} points. Your wager stays private until results. Negative scores may wager 0.</p><form id="wagerForm"><label for="wager">Your wager</label><input id="wager" type="number" min="0" max="${max}" step="1" value="0" required><div class="below"><button>Lock wager</button></div></form>`}</div>`}
 if(state.phase==='final'){html+=question(state.final,'FINAL CHALLENGE',false);html+=state.submitted.includes(t.id)?`<p class="status">Answer locked: <b>${esc(state.myAnswer)}</b><br>Good luck!</p>`:`<form id="answerForm"><label for="finalAnswer">Your team’s final answer</label><input id="finalAnswer" maxlength="200" required autocomplete="off" placeholder="Name the band"><div class="below"><button id="submitFinal">Lock final answer</button></div></form>`}
 if(state.phase==='reveal')html+=question(state.final,'FINAL ANSWER',true)+`<p class="status">Your host is scoring the final round.</p>`;
 if(state.phase==='ended')html+=standings();html+=scores()+`<div class="below">${btn('Leave game','leave','outline small')}</div></div>`;app.innerHTML=html;tick();}
function renderHelp(){app.innerHTML=`<div class="help-content"><div class="eyebrow">THE PLAYBOOK</div><h1>Knowledge meets friendly competition.</h1><h2>1. Get five teams ready</h2><p>Each team picks one captain and one phone. In a live game, the captain scans the QR code or opens the host’s game address and enters the six-digit room code. The host shares their screen with the class.</p><h2>2. Choose a clue</h2><p>There are six clues in each of five categories. Values run from 100 to 600 points, with difficulty increasing down each column. Accounting stays beginner-friendly throughout. The host opens the selected clue and reads it aloud.</p><h2>3. Buzz, answer, score</h2><p>When the host opens the buzzers, captains have 30 seconds to buzz. The first request received by the server wins; network delays can affect order. That team answers aloud. A correct answer earns the clue’s value; a wrong answer loses it and makes the team ineligible for another attempt on that clue. Reopen buzzers to allow a steal. The last correct team chooses the next clue; the host decides who starts.</p><p>Host buttons also let you choose a team manually. Use this for raised-hand play on one screen or to resolve a disputed buzz. Answers do not need to be phrased as questions. The ± control adjusts a score; “Undo score” reverses the most recent clue judgment while the clue is open.</p><h2>4. The final riff</h2><p>The final category is 1990s Heavy Metal. Lock wagers before revealing the clue. Each team may wager 0 up to its positive score; teams at 0 or below can wager 0. A missing wager defaults to 0 when the host starts. Teams have 60 seconds to submit a private answer. The host closes answers, reveals the solution, and judges each response. A missing answer is incorrect. Highest score wins; ties share the win unless you choose a sudden-death question.</p><h2>One-screen mode</h2><p>The standalone HTML file runs without internet. Use raised hands to buzz, then select a team to answer. For the final, teams write wagers and answers on paper; enter wagers before revealing the clue.</p><h2>Phone connections</h2><p>Live phone play requires the included server to run on a computer reachable by the phones, or deployment to a public Node.js host. On the same Wi-Fi, set the phone join address to the network address printed by the server. Some campus networks block device-to-device traffic, so test this in your classroom. Downloaded HTML alone cannot synchronize phones.</p><p>Live rooms use team nicknames only, allow up to five teams, and expire after 24 hours. Restarting the server clears all rooms. Keep the host tab open; host and team access are remembered in that browser tab. One-screen games save in this browser when storage is available. Rejoining from another browser creates a new team; remove the old team in the lobby if necessary.</p><div class="below">${btn('Back to game','back')}</div></div>`;}
function tick(){if(!state)return;const left=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));document.querySelectorAll('[data-timer]').forEach(el=>el.textContent=left+' sec');if(state.deadline&&left===0){const b=document.querySelector('[data-act="buzz"]');if(b)b.disabled=true;const f=document.getElementById('submitFinal');if(f)f.disabled=true;}}
async function startOffline(){localRoom=newRoom('LOCAL',rand());for(let i=1;i<=5;i++)apply(localRoom,{action:'join',name:'Team '+i,id:rand(),token:rand()},null,CONTENT);session={local:true,token:localRoom.host,code:'LOCAL'};state=view(localRoom,localRoom.host,CONTENT);stash();render()}
async function createLive(){try{session=await api('/api/create',{});state=await api('/api/state?code='+session.code);stash();render()}catch(e){toast('Live hosting needs the included server. '+e.message)}}
app.addEventListener('submit',async e=>{e.preventDefault();if(busy)return;const form=e.target;try{if(form.id==='joinForm'){busy=true;session=await api('/api/action',{action:'join',code:document.getElementById('roomCode').value,name:document.getElementById('teamName').value});stash();state=await api('/api/state?code='+session.code);render();busy=false}else if(form.id==='wagerForm')await act('wager',{amount:Number(document.getElementById('wager').value)});else if(form.id==='answerForm')await act('answer',{answer:document.getElementById('finalAnswer').value});}catch(e){busy=false;toast(e.message)}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act,id=b.dataset.id;
 if(a==='help'){help=true;renderHelp();return}if(a==='back'){help=false;render();return}
 if(a==='host')return createLive();if(a==='offline')return startOffline();
 if(a==='fullscreen'){try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch{toast('Use your browser’s fullscreen option.')}return}
 if(a==='leave'||a==='newgame'){if(!confirm(a==='newgame'?'Start a fresh game? Your current scores will remain only in this session.':'Leave this game on this device?'))return;session=null;state=null;localRoom=null;try{sessionStorage.removeItem('carolina-session');localStorage.removeItem('carolina-local')}catch{}lastJSON='';history.replaceState(null,'',location.pathname);render();return}
 if(a==='origin'){let url=prompt('Enter the address phones can reach (for example, http://192.168.1.20:3000).',sessionStorage.getItem('carolina-join-origin')||location.origin);if(!url)return;try{const u=new URL(url);if(!['http:','https:'].includes(u.protocol))throw Error();sessionStorage.setItem('carolina-join-origin',u.origin);render()}catch{toast('Enter a valid http:// or https:// address.')}return}
 if(a==='adjust'){const n=prompt('Point adjustment for this team (use a minus sign to subtract):','0');if(n===null)return;return act('adjust',{id,amount:Number(n)})}
 if(a==='rename'&&session.local){const n=prompt('Team name:',localRoom.teams.find(t=>t.id===id).name);if(!n?.trim())return;const name=n.trim().slice(0,24);if(localRoom.teams.some(t=>t.id!==id&&t.name.toLowerCase()===name.toLowerCase()))return toast('Choose a unique team name.');localRoom.teams.find(t=>t.id===id).name=name;state=view(localRoom,localRoom.host,CONTENT);stash();render();return}
 if(a==='add'){const name=prompt('Team name:');if(!name)return;return act('add',{name,id:rand(),token:rand()})}
 if(a==='final'&&state.used.length<30&&!confirm('Go to Final Challenge with '+(30-state.used.length)+' clues remaining?'))return;
 if(a==='beginFinal'&&session.local){for(const t of localRoom.teams){const n=Number(document.getElementById('w-'+t.id).value);if(!Number.isInteger(n)||n<0||n>Math.max(0,t.score))return toast('Check the wager for '+t.name);localRoom.wagers[t.id]=n}}
 if(a==='export'){const csv='Team,Score\n'+[...state.teams].sort((a,b)=>b.score-a.score).map(t=>'"'+t.name.replaceAll('"','""')+'",'+t.score).join('\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const l=document.createElement('a');l.href=url;l.download='Carolina_Trivia_Scores.csv';l.click();URL.revokeObjectURL(url);return}
 const map={correct:'judge',incorrect:'judge',gradeCorrect:'gradeFinal',gradeIncorrect:'gradeFinal'};await act(map[a]||a,{id,...(['correct','incorrect','gradeCorrect','gradeIncorrect'].includes(a)?{correct:a==='correct'||a==='gradeCorrect'}:{})});});
async function poll(){if(!session||session.local||busy)return;try{const s=await api('/api/state?code='+session.code);connected=true;const str=JSON.stringify(s);if(str!==lastJSON){state=s;lastJSON=str;render()}document.getElementById('connection').textContent='LIVE • ROOM '+session.code}catch(e){connected=false;document.getElementById('connection').textContent='RECONNECTING…'}}
try{session=JSON.parse(sessionStorage.getItem('carolina-session'));if(session?.local&&HAS_SERVER){session=null}else if(session?.local){localRoom=JSON.parse(localStorage.getItem('carolina-local'));if(localRoom)state=view(localRoom,localRoom.host,CONTENT);else session=null}else if(session&&!HAS_SERVER)session=null}catch{session=null}
render();poll();setInterval(poll,700);setInterval(tick,250);
</script></body></html>
